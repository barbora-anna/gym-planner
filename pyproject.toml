[project]
name = "gym-buddy"
version = "0.1.0"
description = "Strength coach toolkit: the gym CLI behind the Coach plugin."
requires-python = ">=3.14"
dependencies = [
    "pydantic",
    "garmin-fit-sdk",
]

[project.scripts]
gym = "gym_buddy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Non-Python files under the package (data/*.json, templates/*.html) ship with it.
packages = ["src/gym_buddy"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
